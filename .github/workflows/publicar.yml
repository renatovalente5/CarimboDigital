name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Não cancela uma publicação a meio: o GitHub Pages não gosta de artefactos
# interrompidos e pode ficar com o site em estado inconsistente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  provar:
    name: Provar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar o que prova o gerador de QR
        # Só para os testes. O site em si não tem dependências nenhumas.
        run: python3 -m pip install --quiet segno opencv-python-headless numpy

      # Um QR com um módulo trocado ainda parece um QR e não lê. Isto
      # descodifica todas as matrizes com um leitor independente, escrito
      # noutra linguagem, e confere as síndromes de Reed-Solomon.
      - name: Provar o gerador de códigos QR
        run: node scripts/verificar-qr.mjs

      # E o leitor: códigos desenhados tortos, de lado, desfocados, com grão e
      # com uma lâmpada de um lado só — que é como uma câmara de balcão os vê.
      - name: Provar o leitor de códigos QR
        run: node scripts/verificar-leitor.mjs

      # A base de dados local do wrangler, e a bateria toda contra ela:
      # códigos repetidos, expirados, forjados, arrefecimento, prémios,
      # anulações e o apagar da conta.
      # A base, o Worker e os testes num comando só. Isto já foi três passos
      # aqui dentro — uma cópia do que o `com-worker.mjs` faz — e as duas
      # versões afastaram-se: a de cá levantava o wrangler sem
      # `--test-scheduled`, e os testes da limpeza diária, que é o que apaga
      # contas, não tinham como disparar o cron. Passando a haver um arranque
      # só, deixa de haver duas versões para divergirem.
      # O `--limpo` deita a base fora antes de aplicar o esquema. Aqui a base
      # já nasce vazia — o que o sinalizador garante é que continua a ser esse
      # o caso provado no dia em que alguém puser cache da pasta `.wrangler`.
      # O esquema esteve com os índices do passe ACIMA da tabela que indexam:
      # numa base que já existe ninguém dá por isso, numa vazia morre tudo.
      - name: Bateria do Worker
        run: node scripts/com-worker.mjs worker/testes.mjs --limpo

      # E a bateria de browser: abre um Chrome sem interface, carrega nos
      # botões com o rato e lê o que aparece. Encontrou quarenta e dois
      # defeitos que a leitura do código não tinha apanhado — botões tapados
      # por avisos, foco que não entra nos painéis, texto cortado a 320 px,
      # a câmara a expulsar o operador da sessão. Nada disso se vê num
      # `node --check`.
      - name: Construir para a bateria de browser
        run: node scripts/gerar.mjs

      - name: Bateria de browser
        run: node scripts/bateria.mjs

      - name: Guardar as fotografias de quem falhou
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bateria
          path: _dev/bateria/
          if-no-files-found: ignore

  construir:
    name: Construir
    needs: provar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # O histórico todo, e não o clone raso de um commit que vem por
          # omissão. O sitemap tira o `lastmod` de cada página da data do
          # último commit que lhe tocou — e num clone raso só existe um
          # commit, pelo que todas as páginas diziam ter mudado no instante
          # da construção. Um `lastmod` assim ensina o motor de busca a
          # ignorar o campo. O repositório é pequeno; buscar tudo não custa.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Não há `npm ci` porque não há package.json: o gerador é Node puro.
      # É de propósito — é o que faz este site continuar a publicar daqui a
      # dois anos sem ninguém lhe tocar.
      - name: Gerar
        run: node scripts/gerar.mjs

      # O travão. Segue ligações, confere o prefixo dos caminhos, os
      # manifestos, o casco offline, os dados legais e procura segredos.
      # Se falhar não se publica — mais vale ficar no ar a versão anterior.
      - name: Auditar
        run: node scripts/auditar.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
