name: Worker

# O Worker publica-se à mão (ou por este botão), e não a cada envio: uma
# publicação da API a meio de um serviço é o género de coisa que se quer
# decidir, não sofrer.
on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A versão vai presa de propósito. O wrangler 4.131 estreou uma
      # «autoconfig» que, se não encontrar configuração à primeira, escreve
      # uma por sua conta — com um nome de Worker inventado e a pasta ao lado
      # como assets. Num runner limpo isso não acontece, mas um `npx` sem
      # versão traz sempre o último, e é assim que uma publicação muda de
      # comportamento sem ninguém ter mudado nada.
      #
      # E o `--config` é o cinto: com o caminho escrito, nenhuma configuração
      # encontrada noutro sítio se pode intrometer.
      - name: Publicar o Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 deploy --config ./wrangler.toml
