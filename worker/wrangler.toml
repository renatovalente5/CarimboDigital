name = "carimbodigital-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Os segredos NÃO vão aqui — este repositório é público. Põem-se com:
#   npx wrangler secret put CHAVE_MESTRA
#   npx wrangler secret put MAIL_TOKEN           (para os emails)
#
# Para gerar a chave-mestra:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"

[vars]
# Vírgulas a separar. Vazio = aceita qualquer origem (só para desenvolver).
# O localhost está aqui de propósito, para se poder desenvolver contra o
# servidor a sério. Não é o que protege a API: os testemunhos de sessão vão no
# cabeçalho `authorization` e não em cookies, por isso um site alheio nunca os
# envia sozinho. Isto é uma camada a mais, não a única.
# O github.io saiu com a chegada do domínio próprio. Não era o endereço
# deste projecto — era o da CONTA inteira, por isso qualquer outro site
# publicado nela podia falar com esta API. E hoje aquele endereço já só
# redirecciona para cá.
ORIGENS = "https://carimbodigital.pt,https://www.carimbodigital.pt,http://localhost:4321"
# O nome que aparece ao lado da morada. A morada em si não se escolhe aqui:
# quem envia é a caixa identificada por MAIL_CAIXA, e o correio sai de lá.
EMAIL_NOME = "Carimbo Digital"

# A caixa de onde sai o correio, na API da Hostinger: geral@carimbodigital.pt.
# Não é segredo — é um identificador de recurso, e descobre-se a qualquer
# momento com `node scripts/email.mjs`. O que é segredo é o token, que vive
# fora daqui:
#
#   npx wrangler secret put MAIL_TOKEN
#
# E é o token de correio, não o de alojamento: cria-se em
# hPanel › Emails › carimbodigital.pt › Agentic mail › API. O de
# hpanel.hostinger.com/api é de outra API e leva 401 aqui.
#
# Atenção ao que esse token abre: não há âmbito só-de-envio. As permissões são
# «manage all SMTP/IMAP actions» — o mesmo token lê, procura e apaga o correio
# de geral@. Nunca entra no repositório, nem em variável de ambiente de CI que
# se possa ler.
MAIL_CAIXA = "AC253ee5cda0314af28894c3718af1"

# O domínio, para os endereços que o Worker escreve dentro do passe da Wallet
# (o logótipo) e para o `origins` do endereço de gravação.
DOMINIO = "carimbodigital.pt"

# ONDE ATENDE O PRÓPRIO WORKER. Quase tudo tira isto do pedido, que é o que
# está sempre certo — mas o reconciliador da Wallet corre no cron e não tem
# pedido nenhum de onde o tirar. Sem isto, o cartão que o reconciliador
# acertasse ficava com o saldo novo e o desenho dos carimbos do dia em que foi
# guardado: o número e a imagem a contarem histórias diferentes.
#
# Uma variável que repete uma coisa que se sabe de outra maneira desactualiza-
# -se, e por isso não fica sozinha: sempre que um PEDIDO passa por aqui, o
# `espelharNaWallet` compara as duas e grita se discordarem. Não é preciso
# alguém lembrar-se de vir cá no dia em que a API mudar de casa.
DOMINIO_API = "carimbodigital-api.renato-lima-valente-dcb.workers.dev"

# A WALLET DO TELEMÓVEL. Enquanto estes três não existirem, as rotas do passe
# respondem 404 e o botão não aparece na app — é o que permite ter isto
# publicado e provado antes de haver conta na Google.
#
#   GOOGLE_EMISSOR  — o Issuer ID da Google Pay & Wallet Console. Não é
#                     segredo: é um número de conta. Põe-se aqui quando houver.
#   GOOGLE_EMAIL    — o `client_email` da conta de serviço. Também não é
#                     segredo.
#   GOOGLE_CHAVE    — a `private_key` do JSON da conta de serviço. ESSA é
#                     segredo, e põe-se com:
#                       npx wrangler secret put GOOGLE_CHAVE
#                     Cola o PEM inteiro, com as linhas BEGIN e END.
GOOGLE_EMAIL = "carimbo-wallet@project-8cb31867-5da0-4e4e-9c3.iam.gserviceaccount.com"

# O TOQUE QUE FAZ O PASSE DA APPLE ACTUALIZAR-SE SOZINHO.
#
# Enquanto estas duas não existirem, o passe continua a ser emitido com o
# endereço do serviço lá dentro — as rotas respondem na mesma — mas nenhum
# aviso sai, e o cartão só se acerta quando o iPhone lhe pega por sua conta.
# É o mesmo desenho das variáveis da Google: publicado e provado antes de
# haver chave.
#
#   APNS_KID     — o Key ID da chave de APNs. NÃO é segredo: é um
#                  identificador de dez caracteres. Põe-se aqui quando houver.
#   APNS_CHAVE   — o conteúdo do ficheiro .p8. ESSE é segredo:
#                    npx wrangler secret put APNS_CHAVE
#                  Cola o PEM inteiro, com as linhas BEGIN e END.
#
# A CHAVE TEM DE SER DA EQUIPA INTEIRA («team-scoped»). No portal da Apple,
# Certificates › Keys › «+», com Apple Push Notification service (APNs)
# marcado. A opção «topic-specific» que aparece ao lado só aceita bundle ids —
# e o tópico de um push de PASSE é o Pass Type ID, não um bundle id. Uma chave
# presa a um bundle dá 403 a isto sem dizer porquê.
#
# O `iss` do bilhete é o APPLE_EQUIPA que já está mais abaixo.
GOOGLE_EMISSOR = "3388000000023200429"

# ENTRAR COM A GOOGLE — outra coisa, e outro projecto da consola. A carteira,
# em cima, fala com a Wallet por uma conta de serviço; isto é o login, e fala
# por OAuth em nome de quem entra.
#
#   GOOGLE_ENTRAR_ID       — o `client_id` do cliente OAuth «Aplicativo da
#                            Web». NÃO é segredo: vai na barra de endereço do
#                            browser em cada entrada, à vista de toda a gente.
#   GOOGLE_ENTRAR_SEGREDO  — o `client_secret`. Esse é, e põe-se com:
#                              npx wrangler secret put GOOGLE_ENTRAR_SEGREDO
#
# Enquanto os dois não existirem, `/v1/portas` diz `google: false` e a app não
# mostra o botão — é a mesma manha da Apple Wallet, e é o que permite publicar
# isto antes de a consola estar pronta.
#
# O projecto é `carimbo-digital-508917`, criado a 17 de Setembro de 2026, com o
# ecrã de consentimento EM PRODUÇÃO (em «Testing» as entradas morriam ao fim de
# sete dias) e âmbitos `openid` e `userinfo.email` — nada de `profile`, que
# traria o nome que a página de privacidade promete não pedir. Sem logótipo
# carregado, de propósito: um logótipo obriga a app a passar por verificação.
#
# Os endereços de volta registados lá são três, e têm de bater à letra:
#   https://carimbodigital.pt/app/
#   https://www.carimbodigital.pt/app/
#   http://localhost:4321/app/
#
# É a app e não uma página do site, de propósito: o manifesto declara
# `scope: "/app/"`, e num iPhone uma volta para fora desse âmbito abre o Safari
# e nunca regressa à app instalada.
GOOGLE_ENTRAR_ID = "834648750841-6te9ulculj64tojq5jsmq4ct7aproqg3.apps.googleusercontent.com"

# AS NOTIFICAÇÕES. Duas metades da mesma chave P-256 (VAPID, RFC 8292):
#
#   PUSH_PUBLICA — vai na barra de endereço de cada subscrição e o browser
#                  guarda-a. Não é segredo, e é o Worker que a serve à app em
#                  `/v1/portas` — não a construção do site. Se a app subscrevesse
#                  com uma chave que o Worker não tem, o browser guardava-a e
#                  todos os envios levavam 403 para sempre, com tudo a parecer
#                  bem deste lado.
#   PUSH_CHAVE   — assina o JWT de cada envio. Segredo:
#                    npx wrangler secret put PUSH_CHAVE
#
# Geram-se as duas com `node scripts/chaves-push.mjs`, UMA vez. Trocá-las
# invalida as subscrições todas: o browser guardou a pública no momento em que
# disse que sim, e não há como lhe pedir que volte a dizer sem pedir outra vez.
#
# Enquanto as duas não existirem, `/v1/portas` diz `push: null` e a app não
# mostra o interruptor — a mesma manha das carteiras e da porta da Google.
PUSH_PUBLICA = "BJE5YyrngA6XMPIRtNaWbZKE379VOOTPy5T9AMPFkk8EFQfK755Clp4Ou_w8AEL2TsV1NApVO8b-yKlOhVK6lgo"

# ENTRAR COM A APPLE — outra coisa da Apple, e não se confunde com a carteira:
# a carteira assina passes com um certificado de Pass Type ID, isto assina um
# *client secret* com uma chave de autenticação. São chaves diferentes e a da
# carteira NÃO serve aqui.
#
#   APPLE_ENTRAR_SERVICO — o Services ID, que é o `client_id` da web.
#   APPLE_ENTRAR_KID     — o identificador da chave `.p8`. Vai no cabeçalho do
#                          JWT para a Apple saber com qual verificar.
#   APPLE_EQUIPA         — o Team ID, o mesmo da carteira, já em baixo.
#   APPLE_ENTRAR_CHAVE   — a `.p8` em PKCS#8. Segredo:
#                            npx wrangler secret put APPLE_ENTRAR_CHAVE
#                          Descarrega-se UMA vez da consola e não há segunda.
#
# Criado a 18 de Setembro de 2026: App ID primário `pt.carimbodigital.app` com
# Sign in with Apple, Services ID `pt.carimbodigital.entrar` agrupado com ele,
# domínio `carimbodigital.pt` e volta em `https://carimbodigital.pt/app/`.
#
# SEM ÂMBITO, e isso é uma decisão com preço. A Apple só manda a morada de
# email se a volta for por POST (`response_mode=form_post`), e a volta aterra
# no GitHub Pages, que só serve GET. Para ter o POST era preciso que o Worker
# tivesse endereço próprio, e isso obrigava a mudar a zona do domínio da
# Hostinger para a Cloudflare. Fica sem morada: quem entrar SÓ pela Apple não
# nos deixa por onde lhe escrever, e o aviso de conta parada não lhe chega — a
# app oferece-lhe juntar um email ou a Google no mesmo painel. É por isso
# também que o quarto passo da consola («Register Email Sources») não é
# preciso: ele só serve para escrever a moradas `privaterelay`.
APPLE_ENTRAR_SERVICO = "pt.carimbodigital.entrar"
APPLE_ENTRAR_KID = "57HH2WUS32"

# A APPLE WALLET. Estes dois NÃO são segredo, e é por isso que estão aqui e não
# num `wrangler secret`: vão dentro de cada `.pkpass` servido, em texto simples,
# no `pass.json`. Qualquer pessoa que descarregue um passe os lê. Guardá-los
# como segredo só dava a ideia errada a quem viesse a seguir.
#
#   APPLE_PASS_TIPO — o Pass Type ID criado no portal da Apple.
#   APPLE_EQUIPA    — o Team ID, dez caracteres. É o `OU` do certificado.
#
# Os três que SÃO segredo vivem fora daqui:
#
#   npx wrangler secret put APPLE_CERTIFICADO   (só o certificado, sem a chave)
#   npx wrangler secret put APPLE_CHAVE         (a chave privada, em PKCS#8)
#   npx wrangler secret put APPLE_CADEIA        (o intermédio WWDR da Apple)
#
# Os três JÁ existem desde 16 de Setembro de 2026, e o passe é servido. Antes
# disso as rotas respondiam 404 e o botão não aparecia — é o que permitiu ter
# isto publicado e provado sem estar meio feito à vista de ninguém.
#
# Quem responde à pergunta «estão preenchidos?» é `applePronta` (e não
# `appleLigada`, que nunca existiu com esse nome); quem responde à pergunta a
# sério — «servem mesmo para assinar, e não caducaram?» — é
# `verificarSegredosApple`. As duas estão no `index.js`.
#
# DUAS DATAS, e a segunda apanha-se desprevenido porque está longe:
#
#   16 de Outubro de 2027 — o certificado do Pass Type ID. É o que assina, e a
#                           partir dessa data não saem passes novos. O Worker
#                           avisa no registo a partir dos 30 dias antes e
#                           recusa-se a assinar depois, com a data na mensagem.
#   10 de Dezembro de 2030 — o intermédio WWDR G4 que vai em APPLE_CADEIA. Não
#                           é nosso e não se renova daqui: quando a Apple o
#                           substituir, é preciso voltar a descarregá-lo de
#                           https://www.apple.com/certificateauthority/ e
#                           trocar o segredo. Sem isso, o iPhone deixa de
#                           conseguir fechar a cadeia e recusa os passes —
#                           mesmo com o certificado de assinatura válido.
#
# O certificado CADUCA a 16 de Outubro de 2027. Nesse dia os passes deixam de
# poder ser emitidos; os que já estão nas carteiras continuam lá.
APPLE_PASS_TIPO = "pass.pt.carimbodigital.cartao"
APPLE_EQUIPA = "6M2QCLR98V"

# QUEM RESPONDE PELO PASSE. Não é cortesia: é o Anexo 5 («Additional Terms for
# Passes») do contrato de programador da Apple, §2.3 — o passe tem de dizer o
# nome, a morada e os contactos (telefone E email) para onde vão as dúvidas e
# as reclamações de quem o usa. Quem responde somos nós, que o assinamos, e não
# o café cujo nome está na frente do cartão.
#
# Sai tudo do `_fonte/config.json`, que é a fonte da verdade do site — se um
# dia mudar lá, muda aqui. NÃO é segredo: vai dentro de cada passe, em texto
# simples, como o resto.
#
# O telefone vai em formato internacional e espaçado como se lê em voz alta:
# quem o vê está a olhar para o ecrã de um telemóvel e vai tocar nele. Não é
# número de valor acrescentado — é o normal, e é isso que o §2.3 quer dizer com
# «contact information to which any end-user questions should be directed».
APOIO_NOME = "Carimbo Digital — Renato Lima Valente"
APOIO_MORADA = "Rua José Moreira 99, 4.º esq., 3700-155 São João da Madeira"
APOIO_TELEFONE = "+351 925 110 570"
APOIO_EMAIL = "geral@carimbodigital.pt"

[[d1_databases]]
binding = "DB"
database_name = "carimbodigital"
# Preenche-se depois de correr `npx wrangler d1 create carimbodigital`.
database_id = "674af7c1-84ec-4b90-80db-f78152c116e0"

[observability]
enabled = true

# Limpeza diária: códigos usados, sessões e ligações expiradas.
[triggers]
# DOIS HORÁRIOS, e o `index.js` distingue-os pelo `evento.cron`.
#
#   17 4 * * *   a limpeza da madrugada: códigos usados, sessões expiradas,
#                contas paradas, e o reconciliador da Wallet do Google.
#
#   * * * * *    os avisos da Apple que ficaram por dar. O carimbo já toca nos
#                aparelhos ele próprio (até cinco, para não gastar os cinquenta
#                subpedidos de uma invocação); isto apanha quem tem mais
#                aparelhos do que isso e quem falhou porque a APNs não
#                respondeu. Um cartão que falhe volta no minuto seguinte, e é
#                isso que torna «actualiza-se sozinho» verdade mesmo quando a
#                Apple tem um mau dia.
#
#                São 1440 invocações por dia, dos 100 000 do plano gratuito.
crons = ["17 4 * * *", "* * * * *"]
