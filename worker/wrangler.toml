name = "carimbodigital-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Os segredos NÃO vão aqui — este repositório é público. Põem-se com:
#   npx wrangler secret put CHAVE_MESTRA
#   npx wrangler secret put MAIL_TOKEN           (para os emails)
#
# Para gerar a chave-mestra:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"

[vars]
# Vírgulas a separar. Vazio = aceita qualquer origem (só para desenvolver).
# O localhost está aqui de propósito, para se poder desenvolver contra o
# servidor a sério. Não é o que protege a API: os testemunhos de sessão vão no
# cabeçalho `authorization` e não em cookies, por isso um site alheio nunca os
# envia sozinho. Isto é uma camada a mais, não a única.
# O github.io saiu com a chegada do domínio próprio. Não era o endereço
# deste projecto — era o da CONTA inteira, por isso qualquer outro site
# publicado nela podia falar com esta API. E hoje aquele endereço já só
# redirecciona para cá.
ORIGENS = "https://carimbodigital.pt,https://www.carimbodigital.pt,http://localhost:4321"
# O nome que aparece ao lado da morada. A morada em si não se escolhe aqui:
# quem envia é a caixa identificada por MAIL_CAIXA, e o correio sai de lá.
EMAIL_NOME = "Carimbo Digital"

# A caixa de onde sai o correio, na API da Hostinger: geral@carimbodigital.pt.
# Não é segredo — é um identificador de recurso, e descobre-se a qualquer
# momento com `node scripts/email.mjs`. O que é segredo é o token, que vive
# fora daqui:
#
#   npx wrangler secret put MAIL_TOKEN
#
# E é o token de correio, não o de alojamento: cria-se em
# hPanel › Emails › carimbodigital.pt › Agentic mail › API. O de
# hpanel.hostinger.com/api é de outra API e leva 401 aqui.
#
# Atenção ao que esse token abre: não há âmbito só-de-envio. As permissões são
# «manage all SMTP/IMAP actions» — o mesmo token lê, procura e apaga o correio
# de geral@. Nunca entra no repositório, nem em variável de ambiente de CI que
# se possa ler.
MAIL_CAIXA = "AC253ee5cda0314af28894c3718af1"

# O domínio, para os endereços que o Worker escreve dentro do passe da Wallet
# (o logótipo) e para o `origins` do endereço de gravação.
DOMINIO = "carimbodigital.pt"

# A WALLET DO TELEMÓVEL. Enquanto estes três não existirem, as rotas do passe
# respondem 404 e o botão não aparece na app — é o que permite ter isto
# publicado e provado antes de haver conta na Google.
#
#   GOOGLE_EMISSOR  — o Issuer ID da Google Pay & Wallet Console. Não é
#                     segredo: é um número de conta. Põe-se aqui quando houver.
#   GOOGLE_EMAIL    — o `client_email` da conta de serviço. Também não é
#                     segredo.
#   GOOGLE_CHAVE    — a `private_key` do JSON da conta de serviço. ESSA é
#                     segredo, e põe-se com:
#                       npx wrangler secret put GOOGLE_CHAVE
#                     Cola o PEM inteiro, com as linhas BEGIN e END.
GOOGLE_EMAIL = "carimbo-wallet@project-8cb31867-5da0-4e4e-9c3.iam.gserviceaccount.com"
GOOGLE_EMISSOR = "3388000000023200429"

[[d1_databases]]
binding = "DB"
database_name = "carimbodigital"
# Preenche-se depois de correr `npx wrangler d1 create carimbodigital`.
database_id = "674af7c1-84ec-4b90-80db-f78152c116e0"

[observability]
enabled = true

# Limpeza diária: códigos usados, sessões e ligações expiradas.
[triggers]
crons = ["17 4 * * *"]
