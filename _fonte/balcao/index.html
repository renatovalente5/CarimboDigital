<!doctype html>
<!-- O BALCÃO É SEMPRE ESCURO, e di-lo no atributo — antes do primeiro pixel.

     Havia aqui um guião a ler a chave do tema e a aplicá-la. A chave é a do
     CLIENTE, e as duas apps partilham a origem: com o cliente em «claro», o
     balcão abria claro e só depois o `balcao.js` forçava o escuro. Medido a
     20× de abrandamento — um telemóvel barato: quatro frames claros, 66 ms de
     branco. É exactamente o clarão que o comentário desse guião dizia existir
     para evitar («de noite, na mão, é uma lanterna»).

     Um atributo no HTML não tem guião nenhum para correr e não chega tarde. O
     `cartaz.html` já fazia assim.

     E o balcão não dá escolha de tema de propósito: não cegar ninguém às sete
     da manhã, a imagem da câmara destacar-se do cromado, e quem tem as duas
     apps nunca abrir a errada por engano. -->
<html lang="pt-PT" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carimbo Digital Balcão</title>
<meta name="description" content="Carimba os cartões dos teus clientes com a câmara do telemóvel.">
<meta name="theme-color" content="#0E0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balcão">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="{{BASE}}/balcao/manifest.webmanifest">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{BASE}}/icones/balcao-apple-touch-icon.png">
<link rel="stylesheet" href="{{BASE}}/estilos/nucleo.css?v={{VERSAO}}">
<link rel="stylesheet" href="{{BASE}}/estilos/app.css?v={{VERSAO}}">
<link rel="stylesheet" href="{{BASE}}/estilos/balcao.css?v={{VERSAO}}">
<script>window.CARIMBO_CONFIG = {{CONFIG}};</script>
</head>
<body class="app balcao">
<a class="saltar" href="#principal">Saltar para o conteúdo</a>

<div id="entrada" class="entrada" hidden>
  <div class="entrada-topo">
    <div class="marca-balcao">
      <span class="marca-selo" aria-hidden="true"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8.5" fill="#5A31E8"/><circle cx="11.2" cy="11.2" r="4.35" fill="#FFFFFF"/><circle cx="20.8" cy="11.2" r="4.35" fill="#FFFFFF"/><circle cx="11.2" cy="20.8" r="4.35" fill="#FFFFFF"/><circle cx="20.8" cy="20.8" r="3.6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity=".55" stroke-dasharray="2.6 2.2" stroke-linecap="round"/></svg></span>
      <span class="marca-palavra"><b>Carimbo</b><i>Digital</i><em>Balcão</em></span>
    </div>
  </div>
  <div class="entrada-meio">
    <h1>O carimbo<br>agora é a câmara.</h1>
    <p>O cliente mostra o código, tu apontas o telemóvel. Um segundo, e está carimbado.</p>
  </div>
  <div class="entrada-acoes" id="entrada-acoes"></div>
</div>

<div id="aplicacao" hidden>
  <header class="topo" id="topo">
    <div class="topo-linha">
      <span class="topo-titulo" id="topo-titulo">Balcão</span>
      <span class="topo-espaco"></span>
      <button class="topo-acao" id="botao-negocio" aria-label="O meu negócio"></button>
    </div>
  </header>
  <main id="principal" class="coluna" tabindex="-1"></main>
  <nav class="barra" aria-label="Navegação do balcão">
    <div class="barra-interior" id="barra"></div>
  </nav>
</div>

<noscript>
  <div class="coluna" style="padding-block:56px">
    <h1>É preciso o JavaScript</h1>
    <p style="margin-top:12px;color:var(--tinta-2)">O balcão precisa da câmara e de JavaScript para funcionar.</p>
  </div>
</noscript>

<script type="module" src="{{BASE}}/balcao/balcao.js?v={{VERSAO}}"></script>
</body>
</html>
