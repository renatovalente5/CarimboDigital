<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Carimbo Digital">
  <!-- Três casas carimbadas e uma por carimbar: o logótipo é um pedaço
       do próprio cartão. A casa vazia leva o mesmo tracejado que a app
       usa, para a marca e o produto serem a mesma coisa. -->
  <rect width="32" height="32" rx="8.5" fill="#5A31E8"/>
  <circle cx="11.2" cy="11.2" r="4.35" fill="#FFFFFF"/>
  <circle cx="20.8" cy="11.2" r="4.35" fill="#FFFFFF"/>
  <circle cx="11.2" cy="20.8" r="4.35" fill="#FFFFFF"/>
  <circle cx="20.8" cy="20.8" r="3.6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity=".55" stroke-dasharray="2.6 2.2" stroke-linecap="round"/>
</svg>
